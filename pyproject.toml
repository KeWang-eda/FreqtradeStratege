[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-strategy"
version = "0.1.0"
description = "Causal research core and FreqAI strategy adapters"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "TA-Lib>=0.6", "PyYAML>=6", "joblib>=1.3", "pyarrow>=15"]

[project.optional-dependencies]
freqai = ["freqtrade", "technical"]
xgboost = ["xgboost>=2"]
test = ["pytest>=8", "ruff"]

[project.scripts]
quant-strategy = "quant_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "test_my_strategy.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
