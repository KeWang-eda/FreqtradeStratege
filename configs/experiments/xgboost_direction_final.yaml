research:
  name: xgboost_direction_final
  model:
    name: xgboost_direction
    params:
      n_estimators: 300
      max_depth: 2
      learning_rate: 0.03
      reg_lambda: 5.0
      subsample: 0.8
      colsample_bytree: 0.8
      objective: binary:logistic
      eval_metric: logloss
      weight_factor: 0.9
      early_stopping_rounds: 30
      verbosity: 0
